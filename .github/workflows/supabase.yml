name: Supabase migrations
# develop → staging, main → production (research.md §7 Supabase 권장 브랜치 전략)
on:
  push:
    branches: [develop, main]
    paths: ["supabase/migrations/**"]
  pull_request:
    paths: ["supabase/migrations/**"]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - name: 타입 drift 검사 (src/types/database.ts가 생긴 뒤부터)
        run: |
          supabase gen types typescript --local > /tmp/database.ts
          if [ -f src/types/database.ts ]; then diff -u src/types/database.ts /tmp/database.ts; else echo "타입 파일 없음 — 첫 배포 뒤 'npm run db:types'로 생성하세요"; fi
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.PRODUCTION_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
      PROJECT_ID: ${{ github.ref_name == 'main' && secrets.PRODUCTION_PROJECT_ID || secrets.STAGING_PROJECT_ID }}
    steps:
      # 지금은 SQL을 Supabase SQL Editor에서 직접 적용한다(DEPLOY.md "DB 변경 적용 방식"). 키가 없으면 실패 대신 건너뛴다
      - name: 키가 없으면 건너뛰기
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Supabase 키가 없어 자동 적용을 건너뜁니다 — SQL Editor에서 직접 적용하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_ID"
      - if: steps.gate.outputs.skip != 'true'
        run: supabase db push
